[mgr]
ratio = [1, 3, 4]
sort_by = "alphabetical"
sort_sensitive = false
sort_reverse = false
sort_dir_first = true
linemode = "size"
show_hidden = false
show_symlink = true

[opener]
edit = [
    { run = 'nvim %s', desc = "Editor", block = true, for = "unix" },
]
open = [
    { run = 'xdg-open %s1', desc = "Open", orphan = true, for = "linux" },
]
pdf = [
    { run = 'zathura %s', desc = "Zathura (Document/Comic Viewer)", orphan = true, for = "unix" },
]
media = [
    { run = 'mpv %s', desc = "MPV Media Player", orphan = true, for = "unix" },
]
browser = [
    { run = 'firefox %s', desc = "Firefox Browser", orphan = true, for = "unix" },
]
rnote = [
    { run = 'rnote %s', desc = "Rnote", orphan = true, for = "unix" },
]
qucs-s = [
    { run = 'qucs-s %s', desc = "Qucs-S", orphan = true, for = "unix" },
]


[open]
prepend_rules = [
    # Markdown & code -> Neovim. Extension rules come first on purpose:
    # first match wins, and mime alone is unreliable for them (empty files
    # report application/octet-stream, *.ts can report video/mp2t), which
    # would drop them to mpv/xdg-open instead of the editor.
    #
    # Markdown
    { url = "*.md", use = [ "edit", "open" ] },
    { url = "*.markdown", use = [ "edit", "open" ] },
    { url = "*.mdown", use = [ "edit", "open" ] },
    { url = "*.mkd", use = [ "edit", "open" ] },
    { url = "*.mdx", use = [ "edit", "open" ] },

    # Systems & compiled languages
    { url = "*.c", use = [ "edit", "open" ] },
    { url = "*.h", use = [ "edit", "open" ] },
    { url = "*.cc", use = [ "edit", "open" ] },
    { url = "*.cpp", use = [ "edit", "open" ] },
    { url = "*.cxx", use = [ "edit", "open" ] },
    { url = "*.hpp", use = [ "edit", "open" ] },
    { url = "*.hh", use = [ "edit", "open" ] },
    { url = "*.cs", use = [ "edit", "open" ] },
    { url = "*.go", use = [ "edit", "open" ] },
    { url = "*.rs", use = [ "edit", "open" ] },
    { url = "*.zig", use = [ "edit", "open" ] },
    { url = "*.swift", use = [ "edit", "open" ] },
    { url = "*.java", use = [ "edit", "open" ] },
    { url = "*.kt", use = [ "edit", "open" ] },
    { url = "*.kts", use = [ "edit", "open" ] },

    # Interpreted & scripting
    { url = "*.py", use = [ "edit", "open" ] },
    { url = "*.pyw", use = [ "edit", "open" ] },
    { url = "*.pyi", use = [ "edit", "open" ] },
    { url = "*.rb", use = [ "edit", "open" ] },
    { url = "*.php", use = [ "edit", "open" ] },
    { url = "*.lua", use = [ "edit", "open" ] },
    { url = "*.pl", use = [ "edit", "open" ] },
    { url = "*.r", use = [ "edit", "open" ] },
    { url = "*.dart", use = [ "edit", "open" ] },
    { url = "*.ex", use = [ "edit", "open" ] },
    { url = "*.exs", use = [ "edit", "open" ] },
    { url = "*.hs", use = [ "edit", "open" ] },
    { url = "*.ml", use = [ "edit", "open" ] },
    { url = "*.mli", use = [ "edit", "open" ] },
    { url = "*.clj", use = [ "edit", "open" ] },
    { url = "*.scala", use = [ "edit", "open" ] },

    # Shell
    { url = "*.sh", use = [ "edit", "open" ] },
    { url = "*.bash", use = [ "edit", "open" ] },
    { url = "*.zsh", use = [ "edit", "open" ] },
    { url = "*.fish", use = [ "edit", "open" ] },
    { url = "*.vim", use = [ "edit", "open" ] },

    # Web & frontend. "*.ts" is TypeScript first, MPEG-TS second.
    { url = "*.ts", use = [ "edit", "open" ] },
    { url = "*.tsx", use = [ "edit", "open" ] },
    { url = "*.mts", use = [ "edit", "open" ] },
    { url = "*.cts", use = [ "edit", "open" ] },
    { url = "*.js", use = [ "edit", "open" ] },
    { url = "*.mjs", use = [ "edit", "open" ] },
    { url = "*.cjs", use = [ "edit", "open" ] },
    { url = "*.jsx", use = [ "edit", "open" ] },
    { url = "*.html", use = [ "edit", "open" ] },
    { url = "*.htm", use = [ "edit", "open" ] },
    { url = "*.css", use = [ "edit", "open" ] },
    { url = "*.scss", use = [ "edit", "open" ] },
    { url = "*.sass", use = [ "edit", "open" ] },
    { url = "*.less", use = [ "edit", "open" ] },
    { url = "*.vue", use = [ "edit", "open" ] },
    { url = "*.svelte", use = [ "edit", "open" ] },
    { url = "*.astro", use = [ "edit", "open" ] },

    # Data & config
    { url = "*.json", use = [ "edit", "open" ] },
    { url = "*.jsonc", use = [ "edit", "open" ] },
    { url = "*.yaml", use = [ "edit", "open" ] },
    { url = "*.yml", use = [ "edit", "open" ] },
    { url = "*.toml", use = [ "edit", "open" ] },
    { url = "*.ini", use = [ "edit", "open" ] },
    { url = "*.cfg", use = [ "edit", "open" ] },
    { url = "*.conf", use = [ "edit", "open" ] },
    { url = "*.xml", use = [ "edit", "open" ] },
    { url = "*.nix", use = [ "edit", "open" ] },
    { url = "*.tf", use = [ "edit", "open" ] },
    { url = "*.tfvars", use = [ "edit", "open" ] },
    { url = "*.sql", use = [ "edit", "open" ] },
    { url = "*.proto", use = [ "edit", "open" ] },
    { url = "*.graphql", use = [ "edit", "open" ] },
    { url = "*.env", use = [ "edit", "open" ] },

    # Notes
    { url = "*.rnote", use = [ "rnote", "open" ] },
    { mime = "application/rnote", use = [ "rnote", "open" ] },

    # Schematics
    { url = "*.sch", use = [ "qucs-s", "open" ] },

    # PDFs, EPUBs, and Comics
    { url = "*.pdf", use = [ "pdf", "open" ] },
    { url = "*.epub", use = [ "pdf", "open" ] },
    { url = "*.cbz", use = [ "pdf", "open" ] },
    { url = "*.cbr", use = [ "pdf", "open" ] },
    { url = "*.cb7", use = [ "pdf", "open" ] },
    { url = "*.cbt", use = [ "pdf", "open" ] },
    { url = "*.djvu", use = [ "pdf", "open" ] },
    { url = "*.xps", use = [ "pdf", "open" ] },
    { url = "*.oxps", use = [ "pdf", "open" ] },
    { mime = "application/pdf", use = [ "pdf", "open" ] },
    { mime = "application/epub+zip", use = [ "pdf", "open" ] },
    { mime = "application/vnd.comicbook+zip", use = [ "pdf", "open" ] },
    { mime = "application/vnd.comicbook-rar", use = [ "pdf", "open" ] },
    { mime = "application/x-cbr", use = [ "pdf", "open" ] },
    { mime = "application/x-cbz", use = [ "pdf", "open" ] },

    # Media
    { mime = "video/*", use = [ "media", "open" ] },
    { mime = "audio/*", use = [ "media", "open" ] },

    # Text & Code
    { mime = "text/*", use = [ "edit", "open" ] },
    { mime = "application/json", use = [ "edit", "open" ] },
    { mime = "application/*javascript", use = [ "edit", "open" ] },
    { mime = "application/toml", use = [ "edit", "open" ] },
    { mime = "application/x-yaml", use = [ "edit", "open" ] },

    # Web
    { mime = "text/html", use = [ "browser", "open" ] },
]
