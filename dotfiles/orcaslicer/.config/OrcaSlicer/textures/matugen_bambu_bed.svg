<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1000" width="1000" height="1000">
  <defs>
    <pattern id="smallGrid" width="10" height="10" patternUnits="userSpaceOnUse">
      <path d="M 10 0 L 0 0 0 10" fill="none" stroke="#241f17" stroke-width="0.5"/>
    </pattern>
    <pattern id="grid" width="100" height="100" patternUnits="userSpaceOnUse">
      <rect width="100" height="100" fill="url(#smallGrid)"/>
      <path d="M 100 0 L 0 0 0 100" fill="none" stroke="#3a342b" stroke-width="1.5"/>
    </pattern>
  </defs>

  <!-- Plate background -->
  <rect width="1000" height="1000" rx="30" fill="#17130b" stroke="#4e4639" stroke-width="6"/>
  
  <!-- Grid overlay -->
  <rect x="50" y="50" width="900" height="900" fill="url(#grid)" stroke="#4e4639" stroke-width="2"/>

  <!-- Center mark -->
  <circle cx="500" cy="500" r="8" fill="#ecc06c"/>
  <circle cx="500" cy="500" r="30" fill="none" stroke="#ecc06c" stroke-width="2" stroke-dasharray="4 4"/>

  <!-- Label text -->
  <text x="500" y="970" text-anchor="middle" fill="#9a8f80" font-family="monospace" font-size="22" font-weight="bold" letter-spacing="4">MATUGEN BUILD PLATE</text>
</svg>