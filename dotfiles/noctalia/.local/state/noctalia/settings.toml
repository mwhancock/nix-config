[plugin_settings."zumik3-del/opencode-go-usage"]
api_key = "oc_sk_991b8f6c54c0_IG6cFlr5AbtaksJ46bJoqUhmRJ9mFyj3"

[plugins]
enabled = [
    "yuuto/calculator",
    "kenn/keybind-cheatsheet",
    "avivbintangaringga/nix-monitor",
    "knyrps/nix-search",
    "mindnbytes/nix-status",
    "fel/podcasts",
    "raycursive/niri-displays",
    "zumik3-del/opencode-go-usage"
]

[shell]
font_family = "Inter"
screen_time_enabled = true

    [shell.panel]
    control_center_placement = "floating"
    session_placement = "floating"
    transparency_mode = "soft"

    [shell.screenshot]
    confirm_region = true
    remember_last_region = true

    [[shell.session.actions]]
    action = "lock"
    countdown_seconds = 0.0
    enabled = false
    shortcut = "1"
    variant = "default"

    [[shell.session.actions]]
    action = "logout"
    countdown_seconds = 0.0
    enabled = true
    shortcut = "2"
    variant = "default"

    [[shell.session.actions]]
    action = "lock_and_suspend"
    countdown_seconds = 0.0
    enabled = true
    shortcut = "3"
    variant = "default"

    [[shell.session.actions]]
    action = "reboot"
    countdown_seconds = 0.0
    enabled = true
    shortcut = "4"
    variant = "default"

    [[shell.session.actions]]
    action = "shutdown"
    countdown_seconds = 0.0
    enabled = true
    shortcut = "5"
    variant = "destructive"

[theme]
builtin = "Gruvbox"
source = "wallpaper"

    [theme.templates]
    community_ids = [
        "antigravity",
        "opencode",
        "spicetify",
        "pywalfox",
        "ungoogled-chromium",
        "discord",
        "micro",
        "neovim",
        "zed",
        "heroiclauncher",
        "steam",
        "fuzzel",
        "fastfetch",
        "thunderbird",
        "zathura",
        "papirus-icons",
        "bat",
        "fzf",
        "lazygit",
        "tmux",
        "yazi"
    ]

[wallpaper]
directory = "/home/mark/Pictures/wallpaper"

    [wallpaper.default]
    path = "/home/mark/Pictures/wallpaper/1-the-backwater.jpg"

    [wallpaper.last]
    path = "/home/mark/Pictures/wallpaper/1-the-backwater.jpg"

[widget.bar]
type = "zumik3-del/opencode-go-usage:bar"

[widget.battery]
display_mode = "graphic"
show_label = false

[widget.bluetooth]
hide_when_no_connected_device = true

[widget.media]
hide_when_no_media = true
show_progress = true

[widget.network]
show_label = false

[widget.notifications]
hide_when_no_unread = true

[widget.tray]
drawer = true

[widget.widget]
type = "weinguyen/opencode-companion:widget"

[widget.workspaces]
capsule_fill = "on_tertiary"
capsule_opacity = 0.42999999999999999