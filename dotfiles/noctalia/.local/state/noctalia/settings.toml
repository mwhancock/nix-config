config_version = 15

[bar.default]
background_opacity = 0.84999998100101948
center = [ "clock", "date", "media" ]
color = "primary"
end = [ "tray", "notifications", "clipboard", "network", "bluetooth", "bar", "widget", "group:g3" ]
margin_edge = 10
margin_ends = 17
radius = 0
start = [ "workspaces" ]

    [[bar.default.capsule_group]]
    accordion = false
    accordion_direction = "end"
    border_width = 1.0
    enabled = true
    fill = "tertiary"
    id = "g3"
    members = [ "battery", "session" ]
    opacity = 0.15000000596046448
    padding = 8.0

[control_center]
width = 1050

[idle]
behavior_order = [ "lock", "screen-off", "lock-and-suspend" ]
pre_action_fade_seconds = 5

    [idle.behavior.lock]
    action = "lock"
    enabled = false
    timeout = 600.0

    [idle.behavior.lock-and-suspend]
    action = "lock_and_suspend"
    enabled = true
    timeout = 900.0

    [idle.behavior.screen-off]
    action = "screen_off"
    enabled = false
    timeout = 610.0

[location]
